[package]
name = "bunkatsu"
version = "0.1.0"
edition = "2024"
description = "Universal high-performance text chunking library"
license = "MIT"
repository = "https://github.com/wihlarkop/bunkatsu"

[lib]
name = "bunkatsu"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28.3", features = ["extension-module"] }
thiserror = "2.0.18"
unicode-segmentation = "1.13.2"
regex = "1.12.3"
uuid = { version = "1.23.1", features = ["v4"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.8.2"

[profile.release]
lto = true
codegen-units = 1
